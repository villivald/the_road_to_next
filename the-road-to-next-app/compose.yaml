services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketbounty
      POSTGRES_PASSWORD: ticketbounty
      POSTGRES_DB: ticketbounty
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbounty -d ticketbounty"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
